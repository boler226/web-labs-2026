<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title=${product.id} != null ? 'Редагування товару' : 'Новий товар')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container container--narrow">
    <h1 th:text="${product.id} != null ? 'Редагування товару' : 'Новий товар'">Product form</h1>

    <form th:action="@{${formAction}}" th:object="${product}" method="post" class="form">
        <div class="field">
            <label for="name">Назва</label>
            <input id="name" type="text" th:field="*{name}"/>
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="field">
            <label for="category">Категорія</label>
            <input id="category" type="text" th:field="*{category}"/>
            <span class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
        </div>

        <div class="field">
            <label for="description">Опис</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="price">Ціна, грн</label>
                <input id="price" type="number" step="0.01" min="0" th:field="*{price}"/>
                <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
            </div>

            <div class="field">
                <label for="quantity">Кількість</label>
                <input id="quantity" type="number" step="1" min="0" th:field="*{quantity}"/>
                <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn--primary">Зберегти</button>
            <a class="btn btn--ghost" th:href="@{/products}">Скасувати</a>
        </div>
    </form>
</main>
</body>
</html>
