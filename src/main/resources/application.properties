spring.application.name=product-catalog

# PostgreSQL connection (matches docker-compose.yml). Override via env vars for local setups.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate keep the schema in sync with entities during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# Credentials for HTTP Basic access to /api/**. Override via env vars outside of local development.
spring.security.user.name=${API_USERNAME:admin}
spring.security.user.password=${API_PASSWORD:admin123}
