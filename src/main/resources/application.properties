spring.application.name=product-catalog

# PostgreSQL connection (matches docker-compose.yml). Override via env vars for local setups.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/product_catalog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate keep the schema in sync with entities during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}

# Lab users for HTTP Basic access to /api/**. Override passwords with environment variables outside local development.
lab.users.admin.password=${ADMIN_PASSWORD:admin123}
lab.users.editor.password=${EDITOR_PASSWORD:editor123}
lab.users.viewer.password=${VIEWER_PASSWORD:viewer123}

# Local lab signing key. Set JWT_SECRET to a private value of at least 32 bytes elsewhere.
lab.jwt.secret=${JWT_SECRET:local-lab-jwt-secret-change-me-1234567890}
